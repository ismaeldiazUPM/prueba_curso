        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ---------------------------------------------------------
      # 2. AÑADE ESTE PASO: Instalar JupyterLite y el kernel
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyterlite-core jupyterlite-pyodide-kernel

